[package]
name = "metis-aggregator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "metis-api"
path = "src/main.rs"

[dependencies]
metis-dbc = { path = "../dbc" }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "signal"] }
strsim = { workspace = true }
utoipa = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa-swagger-ui = { workspace = true }
rust_decimal = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
prometheus = { workspace = true }
once_cell = { workspace = true }
sqlx = { workspace = true }
regex = "1"
zstd = "0.13"
base64 = "0.22"
bs58 = "0.5"
bytemuck = { workspace = true }
solana-pubkey = { workspace = true, features = ["curve25519"] }
# The Metis program's own layouts, curve and quote math, linked as a library (no entrypoint), so
# the adapter reads accounts and prices bets with the very code the program runs.
metis-core = { path = "../programs/core", features = ["no-entrypoint"] }
# Manifest's slim client: instruction builders and order-book parsing, pinned to the commit this
# integration was written and tested against (the crate isn't on crates.io).
manifest-client = { git = "https://github.com/Bonasa-Tech/manifest", rev = "d04b7aa90b098ba64ebcdf398e9a24d89a9114d8" }

[features]
# Which network's trust roots (and so which Config PDA) the adapter derives by default. Match the
# program that is actually deployed; METIS_CONFIG overrides it explicitly.
devnet = ["metis-core/devnet"]
mainnet = ["metis-core/mainnet"]
localnet = ["metis-core/localnet"]
short-timers = ["metis-core/short-timers"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Only the transaction-encoding tests use these: they check the hand-written v0 encoder in
# utils/solana_tx.rs against the official implementation.
solana-message = { workspace = true, features = ["wincode"] }
solana-instruction = { workspace = true }
solana-hash = "4"
# Executing the transactions the adapter builds against the real compiled program.
litesvm = { workspace = true }
metis-oracle = { path = "../programs/oracle", features = ["no-entrypoint"] }
solana-account = { workspace = true }
solana-clock = { workspace = true }
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
