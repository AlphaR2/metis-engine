[workspace]
resolver = "2"
members = ["programs/*", "tools/*", "aggregator", "authority", "dbc"]

[workspace.dependencies]
metis-authority = { path = "authority" }
solana-address = { version = "2.6.1", features = ["bytemuck", "decode"] }
solana-sdk = "4"
solana-system-interface = "3"
solana-account = "4.1.0"
solana-clock = "3.1.1"
solana-instruction = "3.1.0"
solana-keypair = "3.1.2"
solana-message = "4.2.0"
solana-pubkey = "4.1.0"
solana-rpc-client = "4.2.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.0"

#updated list
pinocchio = "0.11.2"
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
pinocchio-associated-token-account = "0.4.0"
litesvm = "0.16.0"
litesvm-utils = "0.4.0"
shank = "0.4.9"
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
proptest = "1.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1.92"
thiserror = "2.0.20"
reqwest = { version = "0.13.5", features = ["json", "query"] }
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["cors", "trace", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
strsim = "0.11.1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
rust_decimal = { version = "1", features = ["serde-str", "maths"] }
dotenvy = "0.15"
chrono = "0.4"
futures = "0.3"
prometheus = "0.14.0"
once_cell = "1.21.4"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "chrono",
    "uuid",
    "migrate",
    "json",
]}


[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
