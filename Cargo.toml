[workspace]
resolver = "2"
members = ["programs/*", "oracle", "sdk", "tools/*"]

[workspace.dependencies]
pinocchio = "0.11.2"
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
pinocchio-associated-token-account = "0.4.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
codama = "0.7.2"
solana-address = { version = "2.6.1", features = ["bytemuck", "decode"] }
litesvm = "0.16.0"
litesvm-utils = "0.4.0"
proptest = "1.6"
solana-sdk = "4"
solana-system-interface = "3"
serde_json = "1.0"
solana-account = "4.1.0"
solana-clock = "3.1.1"
solana-instruction = "3.1.0"
solana-keypair = "3.1.2"
solana-message = "4.2.0"
solana-pubkey = "4.1.0"
solana-rpc-client = "4.2.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
