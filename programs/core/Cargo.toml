[package]
name = "metis-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "metis_core"
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
# Network trust roots, forwarded to metis-authority (see authority/src/network.rs).
devnet = ["metis-authority/devnet"]
mainnet = ["metis-authority/mainnet"]
# Demo timers (windows of seconds/minutes instead of hours/days). Independent of the trust roots, so a
# devnet demo can use its own real roots with short timers. NEVER with `mainnet` (compile_error).
short-timers = []
localnet = ["metis-authority/localnet", "short-timers"]

[dependencies]
metis-dbc = { path = "../../dbc" }
bytemuck = { workspace = true }
pinocchio = { workspace = true }
pinocchio-associated-token-account = { workspace = true }
pinocchio-system = { workspace = true }
pinocchio-token = { workspace = true }
solana-address = { workspace = true }
metis-authority = { workspace = true }
# Core reads the oracle's account through its real types and uses its real program id,
# instead of keeping hand-copied constants that could drift. no-entrypoint: only one
# entrypoint may exist in a program binary, and it is core's.
metis-oracle = { path = "../oracle", features = ["no-entrypoint"] }

[dev-dependencies]
litesvm = { workspace = true }
litesvm-utils = { workspace = true }
proptest = { workspace = true }
solana-sdk = { workspace = true }
solana-system-interface = { workspace = true }
