[package]
name = "metis-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "metis_core"
crate-type = ["cdylib", "lib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
pinocchio = "0.11.2"
pinocchio-associated-token-account = "0.4.0"
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
solana-address = { version = "2.6.1", features = ["bytemuck", "decode"] }

[dev-dependencies]
litesvm = "0.16.0"
litesvm-utils = "0.4.0"
proptest = "1.6"
solana-sdk = "4"
solana-system-interface = "3"
