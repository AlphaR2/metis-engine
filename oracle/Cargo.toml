[package]
name = "metis-oracle"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]


[dependencies]
pinocchio = { version = "0.11.2" }
solana-address = { version = "2.6.1", features = ["bytemuck"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
pack1 = { version = "1.1.0", features = ["bytemuck"] }
pinocchio-log = "0.5.1"
pinocchio-pubkey = "0.3.0"
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
wincode = { version = "0.6.1", features = ["derive"] }
shank = "0.4.9"


[dev-dependencies]
litesvm = "0.16.0"
solana-account = "4.1.0"
solana-address = "2.6.1"
solana-clock = "3.1.1"
solana-instruction = "3.1.0"
solana-keypair = "3.1.2"
solana-message = "4.2.0"
solana-pubkey = "4.1.0"
solana-rpc-client = "4.2.2"
solana-signer = "3.0.1"
solana-transaction = "4.1.0"
