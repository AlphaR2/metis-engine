name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build the programs (the litesvm suites load the .so files)
        run: |
          cargo build-sbf --manifest-path programs/core/Cargo.toml
          cargo build-sbf --manifest-path programs/oracle/Cargo.toml
      - name: Fetch the real Manifest program (read only)
        run: solana program dump MNFSTqtC93rEfYHB6hF82sKdZpUDFWkViLByLd1k1Ms target/deploy/manifest.so --url mainnet-beta
      # clippy reports warnings today (none are errors); fmt is not enforced because the tree was
      # never formatted with default rustfmt. Tighten both when someone cleans them up.
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: The localnet build still compiles (shortened timers, throwaway roots)
        run: cargo check -p metis-core -p metis-oracle --features metis-core/localnet,metis-oracle/localnet
      - name: devnet and mainnet builds must refuse until real keys are filled in
        run: |
          ! cargo check -p metis-core --features devnet
          ! cargo check -p metis-core --features mainnet
